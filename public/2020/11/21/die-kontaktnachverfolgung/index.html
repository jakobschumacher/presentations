# Was macht das Gesundheitsamt
* Fälle/Kontaktpersonen ermitteln und isolieren

1. Einfache Welt
2. Komplizierte Welt
3. Mehr-als-komplizierte Welt

* Trotzdem handeln
* Ziele haben

* Projekte abbrechen
* Zufall mitdenken

# Problem 1
Wie geht man mit dem ständigen Wandel um?
* Personalbereich stärken
* Schulungsbereich stärken
* Mehr bestellen als nötig
* Mehrere Lösungen gleichzeitig

# Problem 2
Wie wirkt man auf die Kultur des &#34;Unternehmens&#34; ein?
* Regelmäßige Treffen
* Prinzip der Freiwilligkeit
* Presse/Bundespräsident

# Beispiel 3
Wie sorgt man als &#34;Sandwich-Führung&#34; für klare Zuständigkeiten?

* Problemannehmer ist Problemzuständiger
* Zaghafter Versuch Zuständigkeiten im Personalbereich aufzuteilen
