# Part V: Classification of surveillance systems

---
# Classifcation of surveillance system
* Indicator-based vs event-based surveillance
* Passive or active surveillance
* Sentinal surveillance
* Syndromic surveillance
* Lab vs clinician-based surveillance

---
# Whats NOT a surveillance system

  Surveillance    | Science
  :---------------|:-------------
  ongoing         | temporary
  problem known   | problem unkown
  no intervention | intervention
  action driven   | hypothesis driven

# Typical problem: timeliness

---

# Typical problem: event definition

* norovirus causes gastroenteritis
* case defintion: lab &#43; gastroenteritis
* lab reports come on their own
* info on gastroenteritis must come from patient
* if you dont ask the patient -&gt; less cases
Solutions tried:
* Monitor lab reports as well
* Analyze the system often

---
# Typical problem: change

* Surveillance systems dont like change
* Example: people see less doctors --&gt; less cases

Solutions tried:
* Create resilient systems

---
# Typical problem: costs and motivation

* No reimbursment -&gt; no reporting
* Lots of reimbursment -&gt; invented cases

Solutions tried
* Establish a strong legal system
* Sentinal surveillance

---
# Typical problem: unkown event

* New events are difficult to monitor
* Example Anatoxin A

Solutions tried:
* invest in networks
* event based surveillance

---
# Typical problem: close to elimination

* nearly eliminated diseases increase false alarms
* example measles: 80% false alarms

Solutions tried:
* adjust case definition
