<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/reveal.js/dist/reset.css">
    <link rel="stylesheet" href="/reveal.js/dist/reveal.css">
    <link rel="stylesheet" href="/reveal.js/dist/theme/white.css">
    <style>
      .reveal h1, .reveal h2, .reveal h3 {
        font-family: 'Yanone Kaffeesatz', sans-serif;
        font-weight: normal;
      }
      .reveal {
        font-family: 'Droid Serif', serif;
        {{ if eq .Params.size "medium" }}
        font-size: 32px;
        {{ end }}
      }
      .reveal code {
        font-family: 'Ubuntu Mono', monospace;
      }
      .reveal .slides section {
        text-align: center;
      }
      .reveal .slides section.has-dark-background h1,
      .reveal .slides section.has-dark-background h2,
      .reveal .slides section.has-dark-background h3 {
        color: #fff;
      }
      .two-columns {
        display: flex;
        gap: 2rem;
        align-items: flex-start;
      }
      .column {
        flex: 1;
      }
    </style>
    <link href="https://fonts.googleapis.com/css?family=Yanone+Kaffeesatz" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Droid+Serif:400,700,400italic" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Ubuntu+Mono:400,700,400italic" rel="stylesheet">
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section data-markdown data-separator="^\n---\n$" data-separator-vertical="^\n--\n$">
          <textarea data-template>
{{ $content := .RawContent }}
{{ $content = replace $content "{{ .Title }}" .Title }}
{{ $content = replace $content "{{ .Params.subtitle }}" .Params.subtitle }}
{{ $content = replace $content "{{ .Params.author }}" .Params.author }}
{{ $content = replace $content "{{ .Params.authoremail }}" (.Params.authoremail | default "jakob.schumacher@web.de") }}
{{ $content = replace $content "{{ .Params.place }}" .Params.place }}
{{ $content = replace $content "{{ .Params.course }}" .Params.course }}
{{ $content = replace $content "{{ .Params.host }}" .Params.host }}
{{ $content = replace $content "{{ .Date.Format \"02.01.2006\" }}" (.Date.Format "02.01.2006") }}
{{ $content = replace $content "{{ .Permalink }}" .Permalink }}
{{ $content }}
          </textarea>
        </section>
      </div>
    </div>

    <script src="/reveal.js/dist/reveal.js"></script>
    <script src="/reveal.js/plugin/notes/notes.js"></script>
    <script src="/reveal.js/plugin/markdown/markdown.js"></script>
    <script src="/reveal.js/plugin/highlight/highlight.js"></script>
    <script>
      Reveal.initialize({
        hash: true,
        center: true,
        plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ],
        markdown: {
          smartypants: true
        }
      });
    </script>
  </body>
</html>
